# Start everything with:  docker compose up --build
# Then open http://localhost:3000
#
# Settings come from the one .env file next to this file (copy .env.example to make it).
services:
  backend:
    build: ./backend
    env_file: .env                  # the backend gets every setting, including GROQ_API_KEY
    ports:
      - "8000:8000"
    volumes:
      - session-data:/app/data      # uploaded files survive a restart

  frontend:
    build:
      context: ./frontend
      args:
        # Only the backend address goes to the website, never the Groq key.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  session-data:
