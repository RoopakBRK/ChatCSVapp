[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RoopakBRK", email = "roopak2804@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "fastapi",
    "groq",
    "httpx",
    "numpy",
    "pandas",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
module-name = ["chatapp", "api", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
